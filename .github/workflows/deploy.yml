name: deploy

# The only way anything reaches the server. A merge to main deploys that
# merge; workflow_dispatch deploys whatever main points at when it runs, so a
# redeploy or a manual retry needs no laptop.
#
# A merge whose push event GitHub never delivers gets no run from here. The
# server notices instead: scripts/deploy_match.py dispatches this workflow
# when main's head has no deploy run after 15 minutes, and alerts when the
# server still differs from main after 30.
#
# The same dispatch also runs a read-only `diagnose`, chosen by the `action`
# input. The two jobs never both run: a push always deploys and can never
# diagnose, and a dispatch does exactly the one that was asked for. That is
# the point of the input — a diagnostic you have to be careful with is a
# diagnostic nobody runs from a phone.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy (default) or diagnose (read-only)"
        type: choice
        default: deploy
        options: [deploy, diagnose]

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the commit to deploy
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          # A push run whose commit is no longer main's head does not deploy.
          # On 21.10.2026 GitHub delivered push events up to 24 minutes late
          # and lost four outright; scripts/deploy_match.py dispatches a
          # catch-up for a lost one. A late event arriving after that would
          # take the server back to an older commit, since deploy.sh resets
          # hard in that direction. The newer head has a run of its own, and
          # that run deploys both.
          if [ "${{ github.event_name }}" = push ]; then
            head=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
            if [ "$head" != "${{ github.sha }}" ]; then
              echo "::notice::${{ github.sha }} is no longer main's head (${head}); the run for ${head} deploys it"
              echo "superseded=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Deploy
        if: steps.sha.outputs.superseded != '1'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KNOWN_HOSTS"
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$d/key"; chmod 600 "$d/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$d/known_hosts"
          # The host key is pinned. StrictHostKeyChecking stays on: a changed
          # key means the connection fails, not that it is accepted and noted.
          ssh -n -i "$d/key" \
              -o IdentitiesOnly=yes \
              -o IdentityAgent=none \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$d/known_hosts" \
              -o ConnectTimeout=15 \
              "moltstack@${DEPLOY_HOST}" \
              "${{ github.event.repository.name }} ${SHA}"
          # The key carries a forced command, so the string above is read as
          # arguments by deploy.sh and never as a shell command.

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the server state
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KNOWN_HOSTS"
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$d/key"; chmod 600 "$d/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$d/known_hosts"
          # Same key, same forced command. `diagnose` in place of a SHA runs
          # ops/diagnose.py and returns before the lock, the checkout and the
          # install — deploy.sh refuses to treat it as a commit.
          ssh -n -i "$d/key" \
              -o IdentitiesOnly=yes \
              -o IdentityAgent=none \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$d/known_hosts" \
              -o ConnectTimeout=15 \
              "moltstack@${DEPLOY_HOST}" \
              "${{ github.event.repository.name }} diagnose" > "$d/out.md"
          # The script prints no secrets — it sources nothing and asks X
          # nothing. This is the belt as well as the braces: anything that
          # looks like a token never reaches a summary GitHub keeps for 90
          # days, and the run fails loudly rather than publishing it.
          if grep -aiE '(AAAA[A-Za-z0-9%_-]{20,}|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY|[0-9]{8,10}:[A-Za-z0-9_-]{35})' "$d/out.md"; then
            echo "::error::diagnose output matched a secret pattern — not published"
            exit 1
          fi
          cat "$d/out.md" >> "$GITHUB_STEP_SUMMARY"
          # Also in the log, so a failed summary upload still leaves the answer.
          cat "$d/out.md"
