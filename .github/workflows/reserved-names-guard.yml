name: reserved-names-guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  guard:
    name: reserved names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan files and new commit messages
        env:
          GUARD_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: python3 .github/scripts/reserved_names_guard.py ci
