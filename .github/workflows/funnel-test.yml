name: funnel test

# Runs the five-class funnel from a clean GitHub runner — outside the
# production box on purpose. Spec: docs/funnel-test.md.
#
# The target is an input with no default. A run against production registers
# agents in the live registry (twelve on 2026-09-19), so it also needs
# write_production=yes. There is no staging API yet.
#
# K4 is not here: it spends real USDC and needs a wallet key, which does not
# belong in CI secrets on this workflow's say-so.

on:
  workflow_dispatch:
    inputs:
      classes:
        description: Classes to run, comma separated
        required: false
        default: K5,K2,K3,K1
      api_base:
        description: API to register against. No default; every run registers agents there.
        required: true
      write_production:
        description: Type yes to let a run against https://api.moltrust.ch register agents in the live registry.
        required: false
        default: "no"

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install requests
        run: python -m pip install --quiet --disable-pip-version-check requests pynacl

      - name: run funnel
        id: run
        env:
          FUNNEL_API_BASE: ${{ inputs.api_base }}
          MOLTRUST_WRITE_PRODUCTION: ${{ inputs.write_production }}
        run: python3 scripts/funnel_test.py --classes "${{ inputs.classes || 'K5,K2,K3,K1' }}" --out funnel-result.json

      - name: summary
        if: always()
        run: |
          if [ -f funnel-result.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('funnel-result.json'))
          print(f"# Funnel — passed: {d['passed']}\n")
          print("| class | step | ok | s | detail |")
          print("|---|---|---|---|---|")
          for c in d['classes']:
              for s in c['steps']:
                  print(f"| {c['key']} | {s['name']} | {'ok' if s['ok'] else '**FAIL**'} | {s['seconds']} | {s['detail']} |")
          print("\n**DIDs created (revoke after):** " + (", ".join(d['dids']) or "none"))
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funnel-result
          path: funnel-result.json
