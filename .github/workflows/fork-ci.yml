# Informational CI for MoltyCel/moltrust-api and its forks.
#
# Runs on EVERY push and PR (main repo included) as a lightweight second check.
# Most of it is advisory, but three jobs are required by the ruleset "main
# protection" and do gate a merge: pytest --collect-only, pytest (credit
# middleware) and bandit SAST (gating). The workflow's own display name still
# says "(informational)" because renaming it would orphan those three required
# checks; the per-job names carry the truth. Display name is "CI
# (informational)" — it was
# originally "Fork CI", but since it also fires on the main repo's own pushes
# (e.g. #250, a MoltyCel push, no fork), that name made a routine red job look
# like foreign fork activity in the failure email. Trigger + coverage unchanged.
#
# Intentionally lightweight — exercises the things that catch the
# common breakage modes without needing a running API or database:
#
#   syntax       — `python -m compileall` on every source dir.
#   import-smoke — actually try `from app.main import app` with all
#                  required env vars set to placeholder values. This
#                  is the only job that catches startup-time
#                  RuntimeError raises (e.g. NONCE_SECRET unset).
#   pytest-coll  — `pytest --collect-only` over the in-repo tests.
#                  Catches ImportError / SyntaxError in test modules
#                  without needing the API + Postgres stack online.
#   whole-suite  — everything under tests/, named as a directory. This is
#                  what makes coverage independent of anyone remembering to
#                  add a file to a list; until 2026-10-17 the lists were the
#                  coverage, and 152 of 208 suites were in none of them.
#   test-coverage— the ratchet: asks pytest what each invocation here would
#                  collect and goes red on a suite that runs in no job.
#   sdk-tests    — the moltrust-enforce SDK suite under sdk/python/.
#                  Its own job because sdk/python/tests sits outside
#                  the repo's `testpaths = tests`, so the jobs above
#                  never collected it. Pure unit tests, no DB, no API.
#   agent-card   — verifies the committed .well-known/agent-card.json with
#                  an independent RFC 8785 implementation against the
#                  published JWK. The only gating job here, because a card
#                  whose signature does not verify is worse than an unsigned
#                  one. Added after the served card shipped a stale signature
#                  for a day on 2026-09-20 with every other job green.
#   unit-tests   — the suites that need no database, actually executed.
#                  collect-only imports them and never runs them, which is how
#                  a stale expectation survived a day unnoticed.
#   ruff         — informational lint, never blocks merge.
#   bandit       — SAST gate. A new Medium/High finding blocks the merge;
#                  everything already found is fixed or carries a # nosec
#                  with a written reason. Renamed from "(informational)"
#                  on 2026-09-23, when the name had been wrong for as long
#                  as the ruleset had required the check.
#
# Triggers on every push and PR. Separate file name (`fork-ci.yml`)
# from PR #14's proposed `ci.yml` so the two can co-exist if PR #14
# lands upstream later.

name: CI (informational)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  # The event is part of the key on purpose. github.ref is refs/heads/<branch>
  # for a push and refs/pull/<n>/merge for a pull_request, so the two already
  # land in different groups by accident; naming the event makes that explicit
  # and survives a change in how refs are computed.
  #
  # Keying on the head commit instead would be worse, not better. With one shared
  # group and cancel-in-progress, the push run and the pull_request run for the
  # same commit supersede each other, and the superseded one stays on the commit
  # as a cancelled run. The ruleset "main protection" counts a cancelled run of a
  # required check as not-success even when a newer successful run of the same
  # name sits beside it: PR #620 had every required check green on its newest run
  # and was refused with "2 of 5 required status checks are cancelled". Merging
  # the groups would manufacture exactly that.
  #
  # What this does fix is load. Measured 2026-10-05 over 24h: 39 runs across 23
  # head commits, 16 duplicates, and this workflow carried 36 of the repository's
  # 44 cancelled jobs. Those cancellations were queue timeouts, not group
  # supersessions — none of the cancelled runs could have displaced another, they
  # were created within seconds of each other on the then-current head, and none
  # was cancelled before 903 seconds of waiting. Fewer queued jobs is the lever.
  group: fork-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: byte-compile every source dir
        run: |
          python -m compileall -q app
          for d in scripts agents agent operator moltbook monitor; do
            [ -d "$d" ] && python -m compileall -q "$d" || true
          done
          # Also top-level scripts that aren't in a directory.
          python -m compileall -q seed_ecosystem.py test_protocol_compliance.py test_sandbox.py 2>/dev/null || true

  import-smoke:
    name: import smoke test (with required env vars)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: import app.main with placeholder env
        # The whole point of this job: catch any startup-time
        # RuntimeError. The security hardening pass added fail-fast
        # checks for NONCE_SECRET, MOLTRUST_API_KEYS, MOLTSTACK_DB_PW
        # — if one of those is missing, the import explodes here
        # rather than in production.
        env:
          MOLTRUST_API_KEYS: 'mt_ci_placeholder_key_does_not_authenticate'
          NONCE_SECRET: 'ci-placeholder-nonce-secret'
          MOLTSTACK_DB_PW: 'ci-placeholder-db-pw'
          # Webhook secrets are fail-fast like the three above: an empty value
          # makes the signature computable, not absent. No test verifies a real
          # signature, and fork runs cannot read repository secrets anyway.
          STRIPE_WEBHOOK_SECRET: 'whsec_ci_placeholder'
          BASESCAN_WEBHOOK_SECRET: 'ci-placeholder-basescan-secret'
          MOLTRUST_ADMIN_USERS: 'ci-admin:admin:$2b$12$ciplaceholderhashthatwillnevermatchanypassword.ciplaceholderhash'
          MOLTRUST_ENV: 'ci'
        run: |
          python -c "from app.main import app; print('app.main imported OK, FastAPI app:', type(app).__name__)"

  pytest-collect:
    name: pytest --collect-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install requirements + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: collect tests
        # Collection imports test modules without running them. Catches
        # ImportError / SyntaxError / fixture-parse errors without
        # needing the API stack online.
        env:
          MOLTRUST_API_KEYS: 'mt_ci_placeholder_key'
          NONCE_SECRET: 'ci-placeholder'
          MOLTSTACK_DB_PW: 'ci-placeholder'
          STRIPE_WEBHOOK_SECRET: 'whsec_ci_placeholder'
          BASESCAN_WEBHOOK_SECRET: 'ci-placeholder-basescan-secret'
        run: |
          # pipefail: without it the pipeline exits with tail's status, so a
          # collection error stayed green. That masked a ModuleNotFoundError
          # in tests/test_content_scout_persist.py for weeks.
          set -o pipefail
          pytest --collect-only -q tests/ test_*.py 2>&1 | tail -40
      - name: no new module-level effects (WORKFLOW 18)
        # A module body defines, it does not act. Blocks a file that sends,
        # writes, deletes, signs or deploys when merely loaded; the existing
        # harmless cases are in config/module_effects_baseline.json, each with
        # a reason. Part of this required job on purpose.
        run: python3 scripts/module_effects.py --check .
      - name: one Telegram sender (issue #744)
        # Every Telegram message leaves through app/notify.py. A new sender, or
        # one that hides the address behind a variable, fails this required
        # job; the ratchet list in the test can only get shorter.
        run: |
          set -o pipefail
          pytest -q --noconftest tests/test_telegram_eine_sendestelle.py 2>&1 | tail -30

  pytest-run:
    name: pytest (credit middleware)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moltstack_sandbox
          POSTGRES_USER: moltstack
          POSTGRES_PASSWORD: ci-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install requirements + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: init test DB schema
        # The schema lives in .github/scripts/ci_init_db.sh because the
        # whole-suite job below needs exactly the same database. Two inline
        # copies drift, and the second one is always the one nobody updates.
        env:
          PGPASSWORD: ci-pw
          PGUSER: moltstack
        run: .github/scripts/ci_init_db.sh
      - name: run credit middleware tests
        # These tests require a live Postgres because credit_middleware
        # connects via db_pool (asyncpg). The service container provides
        # a fresh Postgres on localhost:5432.
        # MOLTRUST_ADMIN_USERS needs a valid bcrypt hash for the format
        # check — the placeholder below passes the regex but won't match
        # any real password.
        env:
          MOLTRUST_API_KEYS: 'mt_ci_placeholder_key'
          NONCE_SECRET: 'ci-placeholder-nonce-secret'
          MOLTSTACK_DB_PW: 'ci-pw'
          # The gate suites connect without a password (tests/test_acceptance_gate.py
          # DB); asyncpg takes it from PGPASSWORD, as in the whole-suite job.
          PGPASSWORD: 'ci-pw'
          STRIPE_WEBHOOK_SECRET: 'whsec_ci_placeholder'
          BASESCAN_WEBHOOK_SECRET: 'ci-placeholder-basescan-secret'
          DB_NAME: moltstack_sandbox
          DB_HOST: localhost
          MOLTRUST_ADMIN_USERS: 'ci-admin:admin:$2b$12$ciplaceholderhashforadminusersformatcheck'
          MOLTRUST_ENV: 'ci'
          CREDITS_ENABLED: 'true'
        # test_v6_request_signature.py and the two gate suites ride along in this
        # required job (ops V6): they hold the line that a DID header alone does
        # not authenticate on /vc/aae/submit and /vc/aae/evaluate, that a revoked
        # DID is refused and that the key in force follows a rotation. In the
        # whole-suite job alone a regression there would not block a merge.
        run: |
          python -m pytest tests/test_credit_middleware.py tests/test_v6_request_signature.py tests/test_acceptance_gate.py tests/test_subject_binding.py -v --tb=short 2>&1

  whole-suite:
    name: pytest (whole suite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moltstack_sandbox
          POSTGRES_USER: moltstack
          POSTGRES_PASSWORD: ci-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install requirements + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout httpx
      - name: init test DB schema
        env:
          PGPASSWORD: ci-pw
          PGUSER: moltstack
        run: .github/scripts/ci_init_db.sh
      - name: place an empty secrets file
        # monitor/poll_payments.py reads ~/.moltrust_secrets on import, at
        # module level, and raises FileNotFoundError when it is absent. On the
        # box the file is always there, so the suite never needed it declared;
        # a runner has no home-directory state at all. Empty is the honest
        # content — load_secret returns "" for every name, which is what a
        # test with a stubbed chain wants anyway.
        run: touch "$HOME/.moltrust_secrets"
      - name: run everything under tests/
        # The job that makes the others' file lists stop mattering. It names a
        # directory, not files, so a suite added tomorrow runs tomorrow.
        #
        # The lists were the defect. On 2026-10-17, 152 of 208 files under
        # tests/ ran in no job at all: `pytest --collect-only` imported them
        # and ran nothing, so a broken expectation inside one of them was
        # invisible. tests/test_ar404_routes.py arrived that way the day
        # before (ops AR-404-1) and was never executed by CI.
        #
        # Postgres and the full conftest are here because a suite should not
        # have to declare which of the two environments it needs — the
        # declaration was the list. --timeout keeps one hanging test from
        # taking the job's whole hour.
        #
        # PGPASSWORD is here and not only in the schema step because several
        # suites build their own connection and pass no password at all:
        # tests/test_evaluator.py:20 is `dict(host=..., database=..., user=
        # "moltstack")`. On the box that reaches peer authentication and
        # succeeds; against a container with a password it is 132 errors
        # reading "password authentication failed". asyncpg falls back to
        # PGPASSWORD, so the suites keep working unchanged in both places.
        env:
          MOLTRUST_API_KEYS: 'mt_ci_placeholder_key'
          NONCE_SECRET: 'ci-placeholder-nonce-secret'
          MOLTSTACK_DB_PW: 'ci-pw'
          PGPASSWORD: 'ci-pw'
          STRIPE_WEBHOOK_SECRET: 'whsec_ci_placeholder'
          BASESCAN_WEBHOOK_SECRET: 'ci-placeholder-basescan-secret'
          DB_NAME: moltstack_sandbox
          DB_HOST: localhost
          MOLTRUST_ADMIN_USERS: 'ci-admin:admin:$2b$12$ciplaceholderhashforadminusersformatcheck'
          MOLTRUST_ENV: 'ci'
          CREDITS_ENABLED: 'true'
        # No `| tail`. The first run of this job reported "102 failed, 132
        # errors" and then cut the list of the 102 off the top of its own
        # output — a job that says a test failed and not which one costs
        # exactly the run it took. `--tb=line` keeps that affordable: one
        # line per failure instead of a traceback, and -rfEs names every
        # failure, error and skip with its file.
        #
        # -v, so the log answers "how did suite X do" and not only "did
        # anything fail". With -q a green file is indistinguishable from a
        # file that was never collected — the two states this job exists to
        # separate. One line per test over 3348 tests; the tracebacks it
        # saves are longer than the names it prints.
        run: pytest -v --tb=line -rfEs --timeout=300 tests/

  test-coverage:
    name: every suite runs somewhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install requirements + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout httpx
      - name: no suite runs in zero jobs
        # The ratchet behind the job above. It asks pytest which files each
        # workflow invocation would collect and fails when a file under
        # tests/ is in none of them. A --collect-only invocation counts for
        # nothing: importing a module is not running it, and that distinction
        # is the whole reason this check exists.
        env:
          MOLTRUST_API_KEYS: 'mt_ci_placeholder_key'
          NONCE_SECRET: 'ci-placeholder-nonce-secret'
          MOLTSTACK_DB_PW: 'ci-placeholder'
          STRIPE_WEBHOOK_SECRET: 'whsec_ci_placeholder'
          BASESCAN_WEBHOOK_SECRET: 'ci-placeholder-basescan-secret'
        run: python3 scripts/ci_test_coverage.py --check
      - name: the check itself has to fail when a file is left out
        # A guard that cannot go red proves nothing. This runs it against a
        # workflow that deliberately omits one suite and expects exit 1.
        env:
          MOLTRUST_API_KEYS: 'mt_ci_placeholder_key'
          NONCE_SECRET: 'ci-placeholder-nonce-secret'
          MOLTSTACK_DB_PW: 'ci-placeholder'
          STRIPE_WEBHOOK_SECRET: 'whsec_ci_placeholder'
          BASESCAN_WEBHOOK_SECRET: 'ci-placeholder-basescan-secret'
        run: |
          set -o pipefail
          pytest -q --noconftest tests/test_ci_test_coverage.py 2>&1 | tail -20

  sdk-tests:
    name: pytest (moltrust-enforce SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: install the SDK and its declared dependencies
        # Deliberately NOT requirements.txt: the SDK ships standalone and must
        # install from its own pyproject alone. Doing it this way means a
        # dependency missing from `[project].dependencies` fails here instead
        # of on a user's machine after `pip install moltrust-enforce`.
        #
        # The `[test]` extra carries pytest and httpx. Since 0.3.0 httpx is no
        # longer a base dependency — it sits in the `client` extra so a party
        # that only recomputes a verdict installs no HTTP client. The client
        # tests still need it, hence the extra rather than a bare install.
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdk/python[test]"
      - name: run the SDK suite
        # Pure unit tests — httpx.MockTransport stands in for the server, so
        # no API and no Postgres. The parity tests find app/enforcement/*.py
        # in this checkout and therefore really compare the vendored cores
        # against the server ones instead of skipping.
        working-directory: sdk/python
        run: |
          set -o pipefail
          pytest -q 2>&1 | tail -30

  agent-card:
    name: pytest (public agent card signature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install the verifier's dependencies only
        # cryptography for the Ed25519 primitive, jcs for the cross-check
        # against the signer's canonicalizer. Not requirements.txt: this suite
        # must stay runnable by anyone who wants to check our card, and the
        # shorter that list is, the more that claim is worth.
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography jcs
      - name: verify the committed card the way a stranger would
        # Gating, not informational. A card whose signature does not verify is
        # worse than an unsigned one: it claims verifiability and fails the
        # check. This job is what stops the 2026-09-20 breakage from recurring
        # — a hand edit to .well-known/agent-card.json fails here.
        #
        # --noconftest because tests/conftest.py pulls in pytest_asyncio and
        # the whole API test rig. This suite needs none of it, and installing
        # it would undercut the claim above: the point is that verifying our
        # card takes pytest, cryptography and an RFC.
        run: |
          set -o pipefail
          pytest -q --noconftest tests/test_public_agent_card_signature.py 2>&1 | tail -30

  onboarding-routes:
    name: pytest (onboarding routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install requirements
        # The full list, unlike the no-database job above: these cases drive
        # the real app through TestClient, so importing app.main pulls in
        # fastapi, slowapi and the rest. Still no database — every case here
        # is decided during dependency resolution, before a query runs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: the keyless path has to say where the key comes from
        # Gating. An agent that registers and then cannot find out how to get
        # an API key gives up, and on 2026-10-04 one did — nine bind retries
        # and no way forward.
        #
        # Same placeholder env as the import smoke test above: app.main
        # fail-fasts on these at import time, deliberately, and none of them
        # authenticates anything.
        env:
          MOLTRUST_API_KEYS: 'mt_ci_placeholder_key_does_not_authenticate'
          NONCE_SECRET: 'ci-placeholder-nonce-secret'
          MOLTSTACK_DB_PW: 'ci-placeholder-db-pw'
          STRIPE_WEBHOOK_SECRET: 'whsec_ci_placeholder'
          BASESCAN_WEBHOOK_SECRET: 'ci-placeholder-basescan-secret'
          MOLTRUST_ADMIN_USERS: 'ci-admin:admin:$2b$12$ciplaceholderhashthatwillnevermatchanypassword.ciplaceholderhash'
          MOLTRUST_ENV: 'ci'
        run: |
          set -o pipefail
          pytest -q --noconftest tests/test_onboarding_key_step.py 2>&1 | tail -30

  unit-tests:
    name: pytest (unit, no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install what these suites actually import
        run: |
          python -m pip install --upgrade pip
          # psycopg2-binary for the board digest: agents/board_digest.py imports
          # the driver at module level and never connects in these tests.
          pip install pytest cryptography jcs httpx requests requests-oauthlib web3 pyyaml psycopg2-binary
      - name: run the suites that need no database
        # This list is no longer anyone's coverage. whole-suite runs every
        # file under tests/ and this job asks a narrower question: do these
        # suites still stand up without the test rig and without a database?
        # A file that grows a dependency on either fails loudly here instead
        # of being quietly carried by conftest.
        #
        # Keeping it a list is the point — the question only makes sense for
        # suites somebody has claimed are self-contained. Adding a file here
        # is a claim; whole-suite covers it either way.
        #
        # --noconftest because tests/conftest.py pulls in pytest_asyncio and
        # the whole API rig; these suites need none of it.
        run: |
          set -o pipefail
          pytest -q --noconftest \
            tests/test_funnel.py \
            tests/test_organic_registrations.py \
            tests/test_notify_channels.py \
            tests/test_watchdog_weekly_checks.py \
            tests/test_watchdog_debounce.py \
            tests/test_watchdog_log_markers.py \
            tests/test_moltbook_silence.py \
            tests/test_wallet_budgets.py \
            tests/test_erc8004_rpc_absence.py \
            tests/test_moltbook_content_rule.py \
            tests/test_moltbook_poster_new_posts.py \
            tests/test_moltbook_heartbeat_content.py \
            tests/test_sm_kpis_moltbook_spam.py \
            tests/test_grant_attenuation.py \
            tests/test_ccx_varwof_crosswalk.py \
            tests/test_writelock.py \
            tests/test_v6_guard_probe.py \
            tests/test_agent_card_guard.py \
            tests/test_w3c_listwatch_skipped.py \
            tests/test_w3c_listwatch_senders.py \
            tests/test_deploy_verify_fingerprint.py \
            tests/test_r4_runway.py \
            tests/test_notify_throttle.py \
            tests/test_funnel_target_guard.py \
            tests/test_did_derivation.py \
            tests/test_key_rotation.py \
            tests/test_registry_proof_rows.py \
            tests/test_artefact_writers.py \
            tests/test_renew_at.py \
            tests/test_referral.py \
            tests/test_board.py \
            tests/test_board_digest.py \
            tests/test_escrow_reconcile.py \
            tests/test_retention_digest.py \
            tests/test_zahl_deklaration.py 2>&1 | tail -30

  ruff:
    name: ruff (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: ruff check
        # Informational only — don't block merge on lint noise. Surfaces
        # in the workflow log so we can clean up over time.
        run: ruff check app/ agents/ scripts/ monitor/ --output-format=concise || true

  # Gating, not informational: a new Medium/High finding stops the PR.
  # Required by the ruleset "main protection" under this exact name.
  bandit-gating:
    name: bandit SAST (gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit
      - name: bandit scan
        # Same scan as the job below, without continue-on-error. A new
