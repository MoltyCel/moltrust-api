id: c-bestellte-berichte
titel: 'Market Watch, News Scout und Content-Scout haben Lars in den letzten 24 Stunden erreicht'
kategorie: "C"
tempo: daily
abfrage:
  art: shell
  wert: |
    cd /home/moltstack/moltstack || exit 2
    ./venv/bin/python scripts/check_bestellte_berichte.py
erwartung:
  operator: eq
  wert: 0
schweregrad: fail
autofix: none
deckel: 0
herkunft: >
  12.11.2026, ops MELD-BERICHT. NOTIFY-4 (#1032, deployt 07.11.2026 11:26:44Z)
  hat die Meldungsart scout-bericht auf ABLAGE gesetzt. Darunter liefen auch
  News Scout und Content-Scout, die Lars bestellt hat und bei jedem Lauf liest.
  Fuenf Tage lang gingen beide nur in die Tagesablage, und keine Wache hat es
  gesehen: c-notify4-nur-handeln prueft, dass nichts Falsches zugestellt wird,
  nicht, dass das Bestellte ankommt. Market Watch (agents/scout.py) hatte nie
  gesendet. Seit MELD-BERICHT ist scout-bericht HANDELN und nur noch diesen drei
  Berichten und der einmaligen Nachreichung vorbehalten
  (tests/test_meld_bericht.py). Diese Pruefung liest im Sendeprotokoll nach, ob
  Market Watch zweimal, News Scout einmal und Content-Scout einmal je 24 Stunden
  zugestellt wurden. Der Content-Scout-Lauf um 17:30 wiederholt den von 06:30
  und bleibt gedrosselt (Entscheidung Koordinator, 12.11.2026).
