id: a-track-record-burst
titel: Kein DID mit mehr als zwei Track Records in sieben Tagen
kategorie: "A"
tempo: hourly
abfrage:
  art: sql
  wert: |
    SELECT count(*) FROM (
      SELECT subject_did FROM credentials
       WHERE NOT revoked AND credential_type = 'TrackRecordCredential'
         AND issued_at > now() - interval '7 days'
       GROUP BY 1 HAVING count(*) > 2) x
erwartung:
  operator: eq
  wert: 0
schweregrad: fail
autofix: none
deckel: 0
bekannter_zustand:
  gruen_erwartet: "2026-10-09T02:33:55+00:00"
  grund: >
    Die drei Schleifen-DIDs (28, 27 und 20 Credentials) stehen noch im
    Siebentagefenster. Entscheid Lars 3.10.: die Duplikate bleiben stehen,
    nur der Fix wirkt vorwaerts. Das Datum ist aus den Daten gerechnet, nicht
    geschaetzt — es ist der Moment, in dem das drittneueste Credential des
    letzten betroffenen DID (did:moltrust:4b7d8cd5…, 2026-10-02 02:33:55 UTC)
    aus dem Fenster laeuft. Haelt der Zustand danach an, ist es ein neuer
    Befund und der Runner sagt UEBERFAELLIG.
herkunft: >
  1.-3.10.2026: drei Agents pollten POST /credentials/track-record statt des
  Trust Score und bekamen 28, 27 und 20 Credentials, alle verankert und alle
  aus BASE_ANCHOR_KEY bezahlt. Fuenf Tage unbemerkt, weil kein Waechter nach
  der Verteilung fragte.
