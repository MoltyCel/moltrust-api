id: c-v6-did-header-needs-proof
titel: /vc/aae/evaluate lehnt den DID-Kopf allein ab (401) und nimmt dieselbe Anfrage signiert an (2xx)
kategorie: "C"
tempo: daily
abfrage:
  art: shell
  wert: |
    /home/moltstack/moltstack/venv/bin/python -I /home/moltstack/moltstack/scripts/v6_guard_probe.py
erwartung:
  operator: contains
  wert: "v6-guard=ok"
# Die Meldung traegt die Ausgabe, damit bei Rot dasteht, welche Richtung
# gescheitert ist.
detail_aus_wert: true
schweregrad: fail
autofix: none
deckel: 0
herkunft: >
  18.10.2026 (ops V6). X-MolTrust-DID galt auf /vc/aae/evaluate und
  /vc/aae/submit ohne jeden Besitznachweis als Anmeldung; live belegt am
  18.10. 10:10Z zwischen zwei eigenen DIDs (nur der Kopf: 200 und je eine
  Zeile aae_evaluations und violation_records fuer die genannte DID). PR 831
  verlangt dort einen API-Key oder eine HTTP-Message-Signatur nach RFC 9421.
  Die Pruefung faehrt beide Richtungen gegen die Produktion, fuer dieselbe
  eigene Test-DID did:moltrust:a2f9415d27094890: Kopf allein muss 401
  ergeben, dieselbe Anfrage signiert 2xx. Nur eine Richtung zu pruefen hiesse,
  einen Deploy, der alles ablehnt, fuer gesund zu halten (Lars, 18.10.).
  Richtung 2 schreibt je Lauf eine aae_evaluations-Zeile und einen
  violation_records-Eintrag der Klasse O (envelope_not_found, ohne Strafe) in
  den Datensatz der Probe-DID, deshalb taeglich. Schluessel:
  ~/.moltrust_testdids/a2f9415d27094890.ed25519 (600). Nie
  did:moltrust:bcd56532a992f0ac: V6 Kriterium (6) zaehlt, dass fuer diese DID
  nach dem Deploy keine Zeile dazukommt.
