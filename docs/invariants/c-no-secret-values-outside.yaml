id: c-no-secret-values-outside
titel: Kein Geheimniswert in Logs, Journal, eigenen Repos oder Archiven
kategorie: "C"
tempo: daily
abfrage:
  art: shell
  wert: |
    cd /home/moltstack/moltstack && python3 -I scripts/secrets_value_scan.py --since 2d
erwartung:
  operator: eq
  wert: 0
detail_aus_wert: true
schweregrad: warn
autofix: none
deckel: 0
herkunft: >
  12.10.2026, Ops S7. Die vorhandenen Pruefungen sehen nur die Secrets-Datei
  selbst (doppelte Schluessel, Klartext-Kopien der ganzen Datei). Ein einzelner
  Wert in einer Logzeile, im Journal, in einer getrackten Repo-Datei oder in
  einem Sicherungsarchiv blieb unbemerkt. Ausgegeben werden nur Fundorte und
  Zahlen, nie ein Wert und nie ein Schluesselname. Geloescht wird nichts:
  welche Kopie weg darf und welcher Schluessel rotiert werden muss, ist ein
  Urteil (Loeschung = ROT). Erster Lauf: 11 Treffer, alle in
  ~/kb-backups/chats-vor-rebuild-20260811-150549.tgz (3 Dateien darin).
