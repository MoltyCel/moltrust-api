id: c-register-keyed-completes
titel: Eine Registrierung ueber /identity/register laeuft bis zum Ende durch
kategorie: "C"
tempo: daily
abfrage:
  art: sql
  wert: |
    SELECT count(*) FROM agents a
     WHERE a.registration_ip IS NOT NULL
       AND a.public_key_hex IS NULL
       AND a.created_at > now() - interval '7 days'
       AND a.created_at < now() - interval '10 minutes'
       AND NOT EXISTS (SELECT 1 FROM email_path_registrations e WHERE e.did = a.did)
erwartung:
  operator: eq
  wert: 0
schweregrad: fail
autofix: none
deckel: 0
herkunft: >
  20.10.2026, ops KM1. `register_agent` las seit #504 (27.09.2026)
  `body.source`, ohne dass `RegisterRequest` das Feld kannte. Jeder Aufruf, der
  an den Sperren vorbeikam, schrieb die Zeile in `agents` und brach danach mit
  AttributeError ab: kein Credential, keine Gutschrift, kein Eintrag in
  `email_path_registrations`, und der Aufrufer bekam eine 500. Im Journal von
  moltstack.service steht das am 06.10. um 14:49:38 und am 11.10. um 13:01:19,
  in `agents` stehen genau diese zwei Zeilen. Gesehen hat es niemand, weil
  `request_log` die 500 nicht fuehrt und keine Wache nach einem halben
  Registrierungsvorgang fragt.

  Die Abfrage erkennt den Schluesselweg an seinen zwei Spuren: nur er und
  register-pop schreiben `registration_ip`, und nur register-pop schreibt
  `public_key_hex`. Die drei anderen Wege, die Agenten anlegen
  (register-batch, GitHub-Anmeldung, ERC-8004-Doppelregistrierung), setzen keine IP und
  fallen deshalb nicht hinein. `email_path_registrations` schreibt der
  Schluesselweg nach Profil und vor dem Credential; fehlt die Zeile, ist der
  Vorgang zwischen beiden abgebrochen.

  Zehn Minuten Abstand, damit eine Registrierung, die gerade laeuft, nicht als
  abgebrochen zaehlt. Sieben Tage Fenster, damit die zwei Zeilen von
  Oktober nicht dauerhaft rot stehen: sie sind ein Befund von damals und keine
  Aussage ueber den heutigen Code. Probe am 20.10.2026 gegen die
  Produktionsdaten: 7 Tage 0, 30 Tage 2, mit Seitenzeile 18.
