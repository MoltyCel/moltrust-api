id: f-escrow-abschluss-gebucht
titel: Kein abgerechneter oder erstatteter Escrow steht noch als escrowed in pool_spend
kategorie: "F"
tempo: daily
abfrage:
  art: shell
  wert: |
    cd /home/moltstack/moltstack || { echo "UNREADABLE kein Checkout"; exit 0; }
    PATH="$HOME/.npm-global/bin:$PATH" timeout 900 python3 scripts/check_escrow_abschluss.py 2>&1 | tail -1
erwartung:
  operator: contains
  wert: "gleich "
schweregrad: fail
autofix: none
deckel: 0
herkunft: >
  16.10.2026: f-no-stale-escrow meldete fuenf liegende Escrows. Drei davon
  waren am 9.10. um 17:17 UTC abgerechnet, je zehn Empfaenger und die vollen
  541000 Mikro-USDC (Bloecke 52388451/53/55) — in pool_spend stand weiter
  escrowed, weil kein Pfad im Repo diesen Zustand fortschreibt. Runde 3 wurde
  am 3.10. von Hand nachgezogen, Runde 4 nicht. Diese Pruefung fragt die
  Gegenrichtung: nicht ob ein Escrow liegt, sondern ob einer nur noch in der
  Buchhaltung liegt. Eine Falschmeldung in einer Geldwache kostet die echte
  Meldung ihre Wirkung. Abschlussweg und Beurteilung:
  scripts/escrow_reconcile.py, Wache: scripts/check_escrow_abschluss.py.
