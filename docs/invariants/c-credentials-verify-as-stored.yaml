id: c-credentials-verify-as-stored
titel: Jedes gespeicherte Credential prueft gegen seinen eigenen verificationMethod
kategorie: "C"
tempo: daily
abfrage:
  art: shell
  wert: |
    /home/moltstack/moltstack/venv/bin/python /home/moltstack/moltstack/scripts/credentials_verify_check.py
erwartung:
  operator: eq
  wert: 0
detail_aus_wert: true
schweregrad: warn
autofix: none
deckel: 0
herkunft: >
  12.10.2026: von 716 gespeicherten Credentials prueften 0 so, wie sie in
  credentials.raw_vc lagen. Der Anker-Batch hatte seit dem 20.09.2026 (#363)
  nach dem Signieren ein Feld evidence in jedes Dokument geschrieben, das die
  Signatur nicht abdeckt. Ohne evidence prueften 702. Der
  Wiederverwendungszweig von POST /credentials/track-record hat vom 03. bis
  04.10. 15 solcher Kopien an 3 DIDs ausgeliefert. Kein Waechter hat es
  gesehen, weil keiner ein gespeichertes Dokument geprueft hat.
  Geprueft wird mit dem oeffentlichen Schluessel aus did.json, ausgewaehlt
  ueber den verificationMethod der Zeile, nicht mit dem aktuellen
  Signierschluessel: so bleibt die Wache auch nach einer Rotation ehrlich.
  Ausgenommen sind die 14 Credentials 925 bis 937 und 940, die in keiner
  getesteten Variante pruefen (KNOWN_UNVERIFIABLE im Skript). Bis die
  Migration evidence entfernt hat, steht der Wert bei 702 und ist bekannt.
