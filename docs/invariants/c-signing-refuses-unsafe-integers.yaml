id: c-signing-refuses-unsafe-integers
titel: Jeder laufende JCS-Signierer lehnt Ganzzahlen ausserhalb +-(2**53-1) ab und laesst die Grenze selbst unveraendert
kategorie: "C"
tempo: daily
abfrage:
  art: shell
  wert: |
    cd /home/moltstack/moltstack && /home/moltstack/moltstack/venv/bin/python -I -c '
    import sys; sys.path.insert(0, ".")
    from app.signature import canonicalize
    from app.crypto.hybrid import _canonicalize
    from app.provenance.ipr import build_canonical_payload
    def ipr(n):
        return build_canonical_payload({"agent_did": "did:moltrust:probe", "confidence": n,
            "confidence_basis": "declared", "output_hash": "h", "output_type": "text",
            "produced_at": "p"})
    signer = {"signature": lambda n: canonicalize({"n": n}),
              "hybrid": lambda n: _canonicalize({"n": n}, "JCS"),
              "ipr": ipr}
    bad, refused = [], 0
    for name, sign in signer.items():
        for n in (2**53 + 1, -(2**53 + 1), 10**21):
            try:
                sign(n); bad.append(name + ":" + str(n))
            except ValueError:
                refused += 1
        if str(2**53 - 1).encode() not in sign(2**53 - 1):
            bad.append(name + ":grenze")
    print("SIGNIERT " + ",".join(bad) if bad else "abgelehnt %d von 9, grenze unveraendert" % refused)
    '
erwartung:
  operator: contains
  wert: "abgelehnt 9 von 9"
schweregrad: fail
autofix: none
deckel: 0
herkunft: >
  14.10.2026 (ops N1). app/signature.py canonicalize reichte jede Eingabe an
  jcs 0.2.1 weiter, das Zahlen ueber einen Double schreibt.
  {"n":9007199254740993} wurde als 9007199254740992 signiert, 10**21 als
  1e+21, also ein anderer Wert als der uebergebene. lib/agent_card_verify.py
  lehnt dieselbe Eingabe seit jeher ab (RFC 7493 Abschnitt 2.2). Aufgefallen
  beim Lauf von agent-evidence-vectors v0.18.1 (W5): raw und signing nahmen
  w3c-f-jcs-Mitglieder an, die abgelehnt gehoeren. Der Test
  tests/test_signature_safe_integers.py haelt den Code im Pflichtschritt; diese
  Pruefung haelt den laufenden Stand, auch gegen einen Wechsel der
  jcs-Version im venv, den CI nicht sieht.
  17.10.2026 (ops V2): app/crypto/hybrid.py (dual_sign, jede W3C-Credential und
  jedes Endorsement) und app/provenance/ipr.py riefen jcs.canonicalize daneben
  direkt auf und signierten auf d2b10d5 weiter den gerundeten Wert. Die Grenze
  steht seitdem in app/safe_integers.py, alle drei Signierer rufen sie, und
  diese Pruefung faehrt alle drei.
