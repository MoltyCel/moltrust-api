id: c-credentials-verify
titel: Jedes gespeicherte Credential prueft gegen seine eigene verificationMethod
kategorie: "C"
tempo: daily
abfrage:
  art: shell
  wert: |
    cd /home/moltstack/moltstack && set -a && . /home/moltstack/.moltrust_secrets && set +a && \
    PYTHONPATH=/home/moltstack/moltstack /home/moltstack/moltstack/venv/bin/python \
      scripts/credentials_verify.py | tail -1
erwartung:
  operator: eq
  wert: 0
schweregrad: warn
autofix: none
deckel: 0
herkunft: >
  12.10.2026, Ops C1. Der Anker-Batch schrieb `evidence` in `raw_vc`, nachdem
  der Aussteller signiert hatte. 0 von 716 gespeicherten Credentials prueften
  so, wie sie gespeichert waren; 702 nach Entfernen von `evidence`, 14 in
  keiner getesteten Variante. Ein Halter, der eine gespeicherte Fassung bekam,
  hielt ein Dokument, das bei jedem Pruefer durchfiel. Die Pruefung geht wie
  ein Aussenstehender vor: Schluessel aus dem veroeffentlichten DID-Dokument,
  ausgewaehlt ueber die verificationMethod der Zeile, nie der Signierschluessel.
  Die 14 bekannten (925-937, 940) sind ausgenommen und vermerkt; jede weitere
  Zeile ist ein Befund.
