id: b-anchors-match-chain
titel: Jeder verankerte Credential-Eintrag nennt eine Transaktion
kategorie: "B"
tempo: hourly
abfrage:
  art: sql
  wert: |
    SELECT count(*) FROM credential_anchors WHERE tx_hash IS NULL OR merkle_root IS NULL
erwartung:
