id: c-aae-evaluate-no-500
titel: POST /vc/aae/evaluate hat in den letzten 24 Stunden keine 500 geantwortet
kategorie: "C"
tempo: hourly
abfrage:
  art: sql
  wert: |
    SELECT count(*) FROM request_log
     WHERE endpoint = '/vc/aae/evaluate' AND status_code >= 500
       AND ts > now() - interval '24 hours'
erwartung:
  operator: eq
  wert: 0
schweregrad: fail
autofix: none
deckel: 0
bekannter_zustand:
  gruen_erwartet: "2026-10-18T16:35:00+00:00"
  grund: >
    Die Live-Probe der Console vom 17.10.2026 16:34:23 UTC (ops V4) hat die
    500 absichtlich ausgeloest, mit action_context.value = 2**53+1. Sie liegt
    bis 18.10. 16:34 UTC im 24-Stunden-Fenster.
herkunft: >
  17.10.2026 (ops V4). /vc/aae/evaluate signiert action_context unveraendert im
  Verdikt-Record. Eine Ganzzahl ausserhalb +-(2**53-1) liess sign_verdict
  innerhalb der Transaktion abbrechen, und der Endpunkt antwortete 500 statt
  einer 4xx mit Grund (live belegt, Journal moltstack.service 16:34:23 UTC).
  Seit dem Fix lehnt die Eingangspruefung mit 422 ab. Die Pruefung zaehlt jede
  500 auf dem Endpunkt, nicht nur diese Ursache.
