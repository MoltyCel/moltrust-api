id: c-secrets-no-plaintext-copy
titel: Keine Klartext-Kopie von ~/.moltrust_secrets unter $HOME
kategorie: "C"
tempo: daily
abfrage:
  art: shell
  wert: |
    bash /home/moltstack/moltstack/scripts/secrets_backup.sh --check-copies
erwartung:
  operator: eq
  wert: 0
detail_aus_wert: true
schweregrad: warn
autofix: none
deckel: 0
herkunft: >
  11.10.2026: sechs Klartext-Kopien ~/.moltrust_secrets.bak-* vom 04. bis
  08.10. lagen neben dem Original, jede eine vollstaendige Abschrift aller
  Zugangsdaten. Am 03.10. waren schon einmal elf solcher Kopien gefunden und
  geloescht worden; danach entstanden neue, weil WORKFLOW 6.2 bis 11.10. vor
  jeder Aenderung eine .bak-Kopie vorschrieb. Die Kopien wurden am 11.10. nach
  Abgleich geloescht, die Anweisung ersetzt durch scripts/secrets_backup.sh
  (verschluesselt, ausserhalb von $HOME).
  Ausgegeben werden nur Pfade, nie Inhalt. Geloescht wird nichts: welche Kopie
  einen Wert traegt, den das Original nicht mehr hat, ist ein Urteil, kein
  Autofix (Loeschung = ROT).
  Bekannt bei Einfuehrung: ~/cleanup-backups/20260510-0938/.moltrust_secrets
  und ~/secret-backups/moltrust_secrets.20260522T112910Z, beide aus dem Mai,
  Entscheidung bei Lars.
