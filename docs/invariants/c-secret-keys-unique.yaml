id: c-secret-keys-unique
titel: Jeder Schlüssel in ~/.moltrust_secrets kommt genau einmal vor
kategorie: "C"
tempo: hourly
abfrage:
  art: shell
  wert: |
    cd /home/moltstack/moltstack || exit 2
    python3 scripts/check_secret_duplicates.py
erwartung:
  operator: eq
  wert: 0
schweregrad: warn
autofix: none
deckel: 0
herkunft: >
  4.10.2026: HEALTHCHECK_URL stand dreimal in ~/.moltrust_secrets — zweimal als
  woertlicher Platzhalter hc-ping.com/DEINE-UUID und einmal mit der echten
  UUID. Die Datei wird mit `set -a; . ~/.moltrust_secrets` gesourct, also
  gewinnt stillschweigend die letzte Zuweisung. Die echte stand zufaellig
  zuletzt, und der Watchdog pingte den richtigen Empfaenger.
  Scharf geworden waere es durch Sortieren der Datei oder dadurch, dass jemand
  einen Schluessel anhaengt, den er fuer fehlend hielt — dann pingt der
  Watchdog ins Leere und meldet den Fehlschlag, oder schlimmer: eine Wallet-
  oder Token-Variable zeigt auf einen alten Wert und niemand sieht es, weil
  beide Zeilen plausibel aussehen.
  Ausgegeben werden nur Schluesselnamen und Zeilennummern. Ein Pruefer fuer
  Geheimnisse, der Werte druckt, um etwas zu belegen, hat sich selbst
  widerlegt — Werte verlassen den Prozess nicht, auch nicht in einer Ausnahme.
  Boden von zwanzig Schluesseln: null Dubletten ist auch das, was eine
  abgeschnittene oder leere Datei meldet, und das ist die Datei mit jedem
  Zugangsdatum dieser Maschine.
