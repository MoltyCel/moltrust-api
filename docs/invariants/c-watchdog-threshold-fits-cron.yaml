id: c-watchdog-threshold-fits-cron
titel: Jede Watchdog-Schwelle ist laenger als die laengste Pause im Cron-Takt des Agents
kategorie: "C"
tempo: daily
abfrage:
  art: shell
  wert: |
    cd /home/moltstack/moltstack && venv/bin/python agents/watchdog.py --thresholds
erwartung:
  operator: eq
  wert: 0
schweregrad: fail
autofix: none
deckel: 0
herkunft: >
  Herald lief ab 21.09.2026 nur noch einmal am Tag (12:00), die Watchdog-Schwelle
  blieb auf 12 h aus dem Takt viermal am Tag. Vom 21.09. bis 16.10. meldete der
  Watchdog Herald zwoelfmal je Tag als ausgefallen, rund 300 Meldungen, waehrend
  jeder Digest erschien (ops WD-1). Wer einen Takt aendert, aendert die Schwelle
  in agents/watchdog.py AGENTS mit; diese Pruefung vergleicht beide.
