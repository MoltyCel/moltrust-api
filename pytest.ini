[pytest]
asyncio_mode = auto
testpaths = tests

# failure_paths.py is a suite despite the name, and pytest had no way to know.
# `pytest tests/` skipped it while the old CI job named it by hand; when that
# list went away on 2026-10-17 the file would have silently stopped running.
# Renaming it would break the Sunday cron wrapper (ops/cron/failure_paths_wache.py)
# and three doc references, so teach the pattern instead.
python_files = test_*.py failure_paths.py
