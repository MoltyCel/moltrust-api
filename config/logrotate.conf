# Agent logs on api.moltrust.ch. Runs unprivileged as moltstack, so it needs
# no /etc/logrotate.d entry and no root:
#
#   /usr/sbin/logrotate -s /home/moltstack/.logrotate.state \
#       /home/moltstack/moltstack/config/logrotate.conf
#
# copytruncate is required: the agents open their log once through the cron
# redirect and append for the life of the process, so a renamed file would keep
# collecting writes on an inode nobody can read any more.
#
# 0640 is the point of the exercise. Until 2026-09-21 the logs were 0664 in a
# 0775 directory, and watchdog.py had written the Telegram bot token into
# watchdog.log 220 times because httpx logs request URLs at INFO.

# Two logs in this directory belong to root cron jobs (0644 root:root), and
# copytruncate needs write permission on the file itself, not on the directory.
# An unprivileged run would fail on them every week. logrotate applies the first
# block that matches a file, so this one claims them with a size threshold they
# will never reach, and they are simply never rotated here. Rotating them is
# root's business, along with the jobs that write them.
/home/moltstack/moltstack/logs/blog_index_selfheal.log
/home/moltstack/moltstack/logs/mp_consumer.log {
    missingok
    size 1000G
}

/home/moltstack/moltstack/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    create 0640 moltstack moltstack
}
