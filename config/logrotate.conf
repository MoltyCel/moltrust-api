# Agent logs on api.moltrust.ch. Runs unprivileged as moltstack, so it needs
# no /etc/logrotate.d entry and no root:
#
#   /usr/sbin/logrotate -s /home/moltstack/.logrotate.state \
#       /home/moltstack/moltstack/config/logrotate.conf
#
# copytruncate is required: the agents open their log once through the cron
# redirect and append for the life of the process, so a renamed file would keep
# collecting writes on an inode nobody can read any more.
#
# Two logs in logs/ belong to root cron jobs (blog_index_selfheal.log from
# /etc/cron.d/moltrust-blog-index, and mp_consumer.log), both 0644 root:root.
# Until 2026-10-05 this file tried to keep them out of the glob by claiming them
# in an earlier block with a size threshold they would never reach, on the
# assumption that logrotate applies the first block that matches a file. It does
# not. logrotate 3.21.0 treats any file claimed twice as a fatal parse error, in
# either order, and that error aborted the run: it processed logs in sorted order
# and stopped at the first duplicate. Measured on 2026-10-05, nine logs were
# considered and everything alphabetically after auto_repair.log had never been
# rotated once — 159 MB in logs/, the ten largest files untouched, moltguard.log
# at 50 MB and endpoint_probe.log at 45 MB.
#
# So there is one glob per directory and nothing else. The two root-owned files
# are excluded by their permissions instead of by a config block: copytruncate
# needs write access to the file, moltstack has none, and logrotate reports
# "error opening ...: Permission denied" for that file and carries on with the
# rest (measured, exit status 1). Two such lines a week in logrotate.log are the
# expected output, not a regression, and rotating those two is root's business
# along with the jobs that write them.
#
# There is deliberately no create directive. Under copytruncate logrotate never
# creates the live file, so create is inert; the archive inherits the mode of the
# file it was copied from. The 0640 that matters — watchdog.py had written the
# Telegram bot token into watchdog.log 220 times before 2026-09-21, because httpx
# logs request URLs at INFO — is carried by the live files themselves, verified
# 0640 on 2026-10-05.

/home/moltstack/moltstack/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
}

# moltycelbot writes through the same kind of cron redirect but was never covered
# here. Its monitor.log had reached 88 MB by 2026-10-05, 313'608 lines of it a
# single repeated "401: Unauthorized" from a token that had been dead for months.
/home/moltstack/moltycelbot/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
}
