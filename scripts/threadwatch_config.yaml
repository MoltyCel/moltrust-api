# Local agent health probes — paths read for liveness signals
agent_health:
  # MoltyCel pending drafts queue
  moltycel_pending_dir: /home/moltstack/moltycelbot/drafts/pending
  # Moltbook agent log files (last successful POST checked)
  moltbook_logs:
    ambassador: /home/moltstack/moltstack/logs/ambassador.log
    moltbook_poster: /home/moltstack/moltstack/logs/moltbook.log
    heartbeat: /home/moltstack/moltstack/logs/moltbook-heartbeat.log
  # Endpoint probe state
  endpoint_probe_state: /home/moltstack/moltstack/state/endpoint_probe.json
  # Stale thresholds (hours)
  agent_stale_hours: 24
  # VCOne suspension check (account public 404 + no events for N hours)
  vcone_account: VCOne-AI
  vcone_stale_hours: 48

# Pinned GitHub Discussions to crawl. Discussions live at a different
