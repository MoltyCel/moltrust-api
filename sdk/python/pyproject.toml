[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moltrust-enforce"
version = "0.4.0"
description = "Reference client for the MolTrust enforce-mode runtime check, ratification and attested-evidence replay"
readme = "README.md"
requires-python = ">=3.10"
# Klassische License-Metadaten (CLAUDE.md Python-Package-Standard): text + leere
# license-files, damit PyPI/twine kein License-Expression/License-File erhalten.
license = { text = "MIT" }
license-files = []
authors = [{ name = "Lars Kroehl", email = "lars@moltrust.ch" }]
keywords = ["moltrust", "agent", "authorization", "enforcement", "aae", "aer", "dsse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Die Basis traegt genau das, was der Nachrechen-Pfad braucht: JCS fuer die kanonische
# Form und Ed25519 fuer Ratifikations- und Evidenz-Signaturen. Der HTTP-Client steht ab
# 0.3.0 im Extra `client` — wer nur nachrechnet, soll keinen Client installieren muessen.
dependencies = [
    "jcs>=0.2",
    "cryptography>=41",
]

[project.optional-dependencies]
# `EnforceClient` spricht mit POST /enforce/check. BREAKING gegenueber 0.2.0: dort kam httpx
# unbedingt mit. Wer den Client benutzt, installiert `moltrust-enforce[client]`; ohne das
# sagt der Import beim Zugriff, was fehlt, statt mit einem nackten ModuleNotFoundError zu
# brechen.
client = ["httpx>=0.24"]
# Der Verifizierer braucht nichts ueber die Basis hinaus. Das Extra steht leer da, damit
# `pip install moltrust-enforce[verify]` laeuft und die Antwort auf die Frage
# „was zieht der Offline-Pfad noch nach" im Paket selbst steht: nichts.
verify = []
test = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
# Der Offline-Verifizierer aus Feature-Spec §5. Namensgleich zum dortigen Vorschlag; das
# npm-Paket `@moltrust/verify` ist eine andere Sache (VC-/On-Chain-Pruefung) und teilt mit
# diesem CLI weder Code noch Format.
moltrust-verify = "moltrust_enforce.cli:main"

[project.urls]
Homepage = "https://moltrust.ch"
Source = "https://github.com/MoltyCel/moltrust-api/tree/main/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["src/moltrust_enforce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
